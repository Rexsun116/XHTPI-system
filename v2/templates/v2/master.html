{% extends 'v2/base.html' %}{% block content %}<h2>{{kind|title}}</h2><form method="post" {% if edit_row %}action="{{url_for('v2.master_edit',kind=kind,row_id=edit_row.id)}}"{% endif %} class="card p-3 mb-4"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><div class="row">{% for f in fields %}<div class="col-md-4 mb-2"><label class="form-label">{{f}}</label><input class="form-control" name="{{f}}" value="{{edit_row|attr(f) if edit_row else ''}}" {% if f in ['code','name','beneficiary_name','bank_name','account_number','model'] %}required{% endif %}></div>{% endfor %}</div><button class="btn btn-primary w-auto">{{'Save' if edit_row else 'Add'}}</button></form><table class="table bg-white"><tr><th>ID</th><th>Code</th><th>Name/Model</th><th>Status</th><th></th></tr>{% for r in rows %}<tr><td>{{r.id}}</td><td>{{r.code}}</td><td>{{r.name if r.name is defined else r.model}}</td><td><form method="post" action="{{url_for('v2.master_toggle',kind=kind,row_id=r.id)}}"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><button class="btn btn-sm btn-outline-secondary">{{'Active' if r.active else 'Inactive'}}</button></form></td><td><a class="btn btn-sm btn-outline-primary" href="{{url_for('v2.master_edit',kind=kind,row_id=r.id)}}">Edit</a></td></tr>{% endfor %}</table>{% endblock %}
