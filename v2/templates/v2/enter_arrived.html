{% extends 'v2/base.html' %}{% block content %}
<h2>Enter ARRIVED · {{ pi.pi_no }}</h2><p class="text-muted">Confirm physical arrival at the destination port.</p>
<form method="post" class="card p-4"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Actual Arrival Date</label><input class="form-control" type="date" name="actual_arrival_date" required value="{{ pi.actual_arrival_date or '' }}"><button class="btn btn-primary mt-3">Confirm ARRIVED</button><a class="btn btn-outline-secondary mt-3" href="{{ url_for('v2.order_view', pi_id=pi.id) }}">Cancel</a></form>{% endblock %}
