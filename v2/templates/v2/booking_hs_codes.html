{% extends 'v2/base.html' %}
{% block content %}
<h2>Booking HS Code · {{ pi.pi_no }}</h2>
<p class="text-muted">这是订单项快照；不会修改 Product master data。</p>
<form method="post" class="card p-4">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  {% for item in pi.items %}
  <div class="border-bottom py-3"><b>{{ item.product_model_snapshot or item.product_category_snapshot or 'Product' }}</b><label class="form-label d-block mt-2">HS Code</label><input class="form-control" maxlength="32" name="product_hs_code_snapshot_{{ item.id }}" value="{{ item.product_hs_code_snapshot or '' }}"></div>
  {% endfor %}
  <button class="btn btn-primary mt-3">保存 HS Code</button>
</form>
{% endblock %}
